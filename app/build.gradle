plugins { id 'com.android.application' }

android {
    namespace 'tw.com.linweijun.chargeguardian'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.com.linweijun.chargeguardian'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('status-monitor.keystore')
            storePassword 'status123'
            keyAlias 'statusmonitor'
            keyPassword 'status123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
